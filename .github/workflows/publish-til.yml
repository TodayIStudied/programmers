name: Publish TIL to Blog

on:
  push:
    branches:
      - main
    paths:
      - "*/*.md"
      - "scripts/export_til.py"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-til
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TIL repository
        uses: actions/checkout@v6

      - name: Checkout blog repository
        uses: actions/checkout@v6
        with:
          repository: TodayIStudied/programmers.github.io
          ref: main
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog

      - name: Convert TIL files to Jekyll posts
        run: python3 scripts/export_til.py blog

      - name: Commit and push generated posts
        working-directory: blog
        run: |
          git config user.name "todayistudied-bot"
          git config user.email "todayistudied-bot@users.noreply.github.com"

          git add -A _posts/til

          if git diff --cached --quiet; then
            echo "변경된 게시물이 없습니다."
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          git commit \
            -m "chore: sync TIL from programmers ${SHORT_SHA}"

          git push origin HEAD:main